name: Check
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  editorconfig-check:
    name: EditorConfig Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install EditorConfig checker
        uses: editorconfig-checker/action-editorconfig-checker@main

      - name: Run EditorConfig checker
        run: editorconfig-checker --exclude '(^LICENSE|^apps/rust-server/.*)'

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v22

  syncpack:
    name: Syncpack Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # To resolve: ✗ Node.js v22.6.0 or higher is needed for a TypeScript config file
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install dependencies
        run: bun install syncpack

      - name: Run Syncpack
        run: bun run syncpack

  bun-check:
    name: Bun Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies, generate DB schema and OpenAPI spec
        run: |
          bun install
          cd apps/server
          bun run db-generate
          bun run tsoa
          bun run openapi
          cd ../../

      - name: Run checks
        run: bun run check

      - name: Test OAuth relay
        run: bun test apps/server/src/lib/ricochetOAuth.test.ts

  uv-lint:
    name: UV Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run UV Lint
        run: cd apps/dataflow && uv sync --locked && uv run --locked --no-sync lint

      - name: Test source pipeline and population
        run: cd apps/dataflow && PYTHONPATH=src uv run --locked --no-sync python -m unittest discover -s tests -v
