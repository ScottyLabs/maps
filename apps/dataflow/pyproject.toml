[project]
name = "dataflow"
version = "0.1.0"
description = "Responsible for handling data flow for CMU Maps"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "colorama>=0.4.6",
  "defusedxml>=0.7.1",
  "minio>=7.2.20",
  "pydantic>=2.12.5",
  "python-dotenv>=1.2.1",
  "requests>=2.32.5",
  "shapely==2.1.1",
  "numpy>=1.26.0",
  "selenium>=4.0.0",
  "svgpathtools>=1.7.2",
]

[dependency-groups]
# Capture and processing helpers install only the dependencies their stage needs.
fms = [
  "defusedxml>=0.7.1",
  "pydantic>=2.12.5",
  "requests>=2.32.5",
  "selenium>=4.0.0",
]
# The population CLI does not need the scraper's platform-specific GIS packages.
populate = [
  "colorama>=0.4.6",
  "minio>=7.2.20",
  "pydantic>=2.12.5",
  "python-dotenv>=1.2.1",
  "requests>=2.32.5",
]
dev = [
  "mypy>=1.19.1",
  "ruff>=0.14.11",
  "ty>=0.0.10",
  "types-colorama>=0.4.15.20250801",
  "types-defusedxml>=0.7.0.20240218",
  "types-requests>=2.32.4.20260107",
]
pipeline = [
  { include-group = "populate" },
  "defusedxml>=0.7.1",
  "numpy>=1.26.0",
  "shapely==2.1.1",
  "svgpathtools>=1.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/_25live",
  "src/clients",
  "src/deserializer",
  "src/linter",
  "src/logger",
  "src/models",
  "src/processor",
  "src/scraper",
]

[project.scripts]
populate-database = "deserializer:main"
process-25live = "_25live:main"
lint = "linter:main"
scrape-fms = "scraper.fms.cli:main"

# Supported rules https://github.com/charliermarsh/ruff/#supported-rules
[tool.ruff]
lint.select = ["ALL"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["shapely.*", "svgpathtools.*"]
ignore_missing_imports = true

# Upgrade all non-error rules to "error"
[tool.ty.rules]
# Defaults: warn
ambiguous-protocol-member = "error"
deprecated = "error"
ignore-comment-unknown-rule = "error"
invalid-ignore-comment = "error"
possibly-missing-attribute = "error"
possibly-missing-implicit-call = "error"
redundant-cast = "error"
undefined-reveal = "error"
unresolved-global = "error"
unsupported-base = "error"
unused-ignore-comment = "error"
useless-overload-body = "error"

# Defaults: ignore
division-by-zero = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
