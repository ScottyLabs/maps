[project]
name = "maps"
revision = "1.0"

[providers]
local = "dotenv://.env"
openbao = "openbao://secrets.scottylabs.org/secret"
openbao-ci = "openbao://secrets.scottylabs.org/secret?auth=jwt&role=ci&audience=openbao"

# DATABASE_URL, PORT, APP_URL, COMMIT_HASH come from devenv/kennel, not here.
# apps/dataflow S3 creds live in a gitignored .env via the `local` provider.
[profiles.default]
OIDC_CLIENT_ID = { description = "OIDC client ID" }
OIDC_CLIENT_SECRET = { description = "OIDC client secret" }
KEYCLOAK_URL = { description = "Keycloak base URL" }
KEYCLOAK_REALM = { description = "Keycloak realm name" }
OAUTH_RELAY_URL = { description = "OAuth relay callback URL" }
PROJECT_GROUP = { description = "Keycloak project group path" }
PROJECT_ADMIN_GROUP = { description = "Keycloak project admin group path" }
# Public, domain-scoped keys the browser needs; served by GET /api/config
# because the SPAs are built in a sandbox that cannot reach OpenBao.
MAPKIT_TOKEN = { description = "Apple MapKit JS token", required = false }
GOOGLE_MAPS_API_KEY = { description = "Google Maps API key", required = false }

[profiles.prod]
SENTRY_DSN = { description = "Sentry DSN for error reporting", required = false }
POSTHOG_KEY = { description = "PostHog project key for product analytics", required = false }
POSTHOG_HOST = { description = "PostHog host for product analytics", required = false }

[profiles.staging]

[profiles.preview]

[profiles.dev.defaults]
providers = ["openbao"]

[profiles.dev]

[profiles.ci.defaults]
required = false
providers = ["openbao-ci"]

[profiles.ci]
