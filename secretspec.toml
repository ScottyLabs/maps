[project]
name = "maps"
revision = "1.0"

[providers]
local = "dotenv://.env"
openbao = "openbao://secrets.scottylabs.org/secret"

[profiles.default]
# Governance's posthog feature writes the project key to the prod profile as
# POSTHOG_KEY. Kennel only serves PUBLIC_ names to the browser, so point at it.
# The key is public by design (it ships in every page), so previews share it.
PUBLIC_POSTHOG_KEY = { description = "PostHog project API key", required = false, ref = { item = "secretspec/maps/prod/POSTHOG_KEY", field = "value" } }
PUBLIC_POSTHOG_HOST = { description = "PostHog ingestion host", default = "https://v.scottylabs.org" }

[profiles.prod]

[profiles.staging]

[profiles.preview]

[profiles.dev.defaults]
providers = ["openbao"]

[profiles.dev]

[scopes.public]
secrets = ["PUBLIC_POSTHOG_KEY", "PUBLIC_POSTHOG_HOST"]
