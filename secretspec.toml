[project]
name = "maps"
revision = "1.0"

[providers]
openbao = "openbao://secrets.scottylabs.org/secret"

[defaults]
providers = ["openbao"]

[profiles.default]
OIDC_CLIENT_ID = { description = "OIDC client ID" }
OIDC_CLIENT_SECRET = { description = "OIDC client secret" }
KEYCLOAK_URL = { description = "Keycloak base URL" }
KEYCLOAK_REALM = { description = "Keycloak realm name" }
OAUTH_RELAY_URL = { description = "OAuth relay callback URL" }
PROJECT_GROUP = { description = "Keycloak project group path" }
PROJECT_ADMIN_GROUP = { description = "Keycloak project admin group path" }
PUBLIC_MAPKIT_TOKEN = { description = "Apple MapKit JS token", required = false }
PUBLIC_GOOGLE_MAPS_API_KEY = { description = "Google Maps API key", required = false }

[profiles.prod]
SENTRY_DSN = { description = "Sentry DSN for error reporting", required = false }
PUBLIC_POSTHOG_KEY = { description = "PostHog project key for product analytics", required = false }
PUBLIC_POSTHOG_HOST = { description = "PostHog host for product analytics", required = false }

[profiles.staging]

[profiles.preview]

[profiles.dev]

[scopes.public]
secrets = [
  "PUBLIC_MAPKIT_TOKEN",
  "PUBLIC_GOOGLE_MAPS_API_KEY",
  "PUBLIC_POSTHOG_KEY",
  "PUBLIC_POSTHOG_HOST",
]
