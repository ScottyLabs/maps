name: "cmumaps"

services:
  dev:
    container_name: cmumaps-dev
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - nix_store:/nix
      - devenv_cache:/root/.cache/devenv
      - dataflow_cache:/root/.cache/cmumaps-dataflow
      # Keep Linux dependencies separate from dependencies installed on the host.
      - node_modules:/workspace/node_modules
      - server_modules:/workspace/apps/server/node_modules
      - web_modules:/workspace/apps/web/node_modules
      - visualizer_modules:/workspace/apps/visualizer/node_modules
      - common_modules:/workspace/packages/common/node_modules
      - ui_modules:/workspace/packages/ui/node_modules
      - websocket_modules:/workspace/packages/websocket/node_modules
    working_dir: /workspace
    init: true
    # Clear devenv PID/socket files on restart; persistent data lives in volumes.
    tmpfs:
      - /tmp:exec,mode=1777
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:8090:8090"
    command: devenv up
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: cmumaps-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: donotuseinprod
      POSTGRES_DB: cmumaps
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cmumaps"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
  nix_store:
  devenv_cache:
  dataflow_cache:
  node_modules:
  server_modules:
  web_modules:
  visualizer_modules:
  common_modules:
  ui_modules:
  websocket_modules:
